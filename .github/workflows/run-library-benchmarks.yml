name: Run library benchmarks

on:
  push:
    paths:
      - "packages/ctf-mn-api/**"
  pull_request:
    paths:
      - "packages/ctf-mn-api/**"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run library benchmarks
        run: pnpm --filter @ctf-mn/api bench

